name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.8.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.25.1
          cache: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 0x000000000000000000001/gopurs
          ref: d79955b212137ccdb8728031b695de15cc7d439d
          path: .ci-gopurs-runtime
          sparse-checkout: runtime
      - name: Check native listener behavior
        run: node test/listener-added-native.mjs
        env:
          GOPURS_ROOT: ${{ github.workspace }}/.ci-gopurs-runtime
          GOPURS_NATIVE_TEST_RACE: '1'
      - name: Install pinned JavaScript toolchain
        run: npm install --global purescript@0.15.16 spago@0.93.45
      - name: Select upstream JavaScript dependencies
        # Go sibling overrides contain native-only FFI; the JS check uses the
        # same declared dependencies and pinned registry set without overrides.
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, rmSync, writeFileSync } from 'node:fs';
          const parts = readFileSync('spago.go.yaml', 'utf8').split('  extraPackages:');
          if (parts.length !== 2) throw new Error('Expected one Go override section');
          rmSync('spago.yaml');
          rmSync('spago.lock');
          writeFileSync('spago.yaml', parts[0]);
          JS
      - name: Run JavaScript tests
        run: spago test
